# 部署前替换 <domain>；安装脚本通过 QWENNOTE_DOMAIN 自动渲染。
# Bootstrap only, before a trusted certificate exists.
server {
    listen 80;
    server_name <domain>;
    client_max_body_size 2m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://<domain>$request_uri; }
}
