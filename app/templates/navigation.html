<div class="mobile-navigation">
  <button id="navigation-open" class="navigation-button" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <a class="brand" href="/">QwenNote</a>
</div>
<div id="navigation-overlay" hidden></div>
<aside id="sidebar" class="sidebar" aria-label="主导航">
  <div class="sidebar-heading">
    <a class="sidebar-brand" href="/" aria-label="QwenNote"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="navigation-label" data-label="QwenNote">QwenNote</span></a>
    <button id="navigation-toggle" class="navigation-button" type="button" aria-label="收起导航" aria-controls="sidebar-links" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <button id="navigation-close" class="navigation-button" type="button" aria-label="关闭导航"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
  </div>
  <nav id="sidebar-links">
    {% for href, label, icon in [('/', '会议', 'meeting'), ('/hotwords', '热词中心', 'hotwords'), ('/assistant', 'AI 助手配置', 'assistant'), ('/settings', '设置中心', 'settings')] %}
    {% if icon == 'meeting' or navigation_admin %}
    <a class="navigation-link" href="{{ href }}" aria-label="{{ label }}" data-label="{{ label }}"{% if request.url.path == href or (href == '/' and request.url.path.startswith('/recordings/')) %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true">{% if icon == 'meeting' %}<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7 13h3M7 16h7"/>{% elif icon == 'hotwords' %}<path d="M4 5h10M9 3v2M6 5c0 6 6 9 8 9M12 5c0 6-6 9-8 9M14 21l4-10 4 10M15.5 17h5"/>{% elif icon == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>{% else %}<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6Z"/>{% endif %}</svg>
      <span class="navigation-label" data-label="{{ label }}">{{ label }}</span>
    </a>
    {% endif %}
    {% endfor %}
  </nav>
</aside>
