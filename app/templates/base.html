<!doctype html>
<html lang="zh-CN">

  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v=20261030-10">
  <script src="{{ url_for('static', path='navigation.js') }}?v=20261030-09" defer></script>
</head>
<body{% if navigation_user %} class="has-navigation"{% endif %}>

</html>
